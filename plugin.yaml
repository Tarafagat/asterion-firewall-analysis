name: asterion-firewall-analysis
version: 0.1.0
description: Analiza el firewall real de la máquina y devuelve hallazgos con severidad y recomendación.
author: Asterion
license: Apache-2.0
contract_version: asterion.plugin/v1
language:
    name: go
    version: "1.25"
start:
    command: ./asterion-firewall-analysis
port: 0
health_path: /health
api:
    base_path: /api/v1
    openapi: api/openapi.yaml
permissions:
    filesystem:
        - ./data
resources:
    - name: analysis
      endpoint: /analysis
      primary_key: analyzed_at
      crud:
        - list
    - name: history
      endpoint: /history
      primary_key: analyzed_at
      crud:
        - list
    - name: rule-sets
      endpoint: /rule-sets
      schema: resources/schemas/rule_set.json
      primary_key: id
      crud:
        - create
        - read
        - update
        - delete
        - list
actions:
    - name: run_analysis
      method: POST
      endpoint: /analysis
      description: Corre un análisis fresco y lo guarda en el historial
    - name: lab_test_rule_set
      method: POST
      endpoint: /rule-sets/{id}/lab-test
      description: Prueba un conjunto de reglas de verdad en un Asterion Lab efímero (VMs QEMU reales) y devuelve el resultado
